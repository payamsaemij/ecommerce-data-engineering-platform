
services:

  postgres:
    build:
      context: ./docker/postgres
    container_name: ecommerce-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ecommerce_db
      POSTGRES_USER: ecommerce_user
      POSTGRES_PASSWORD: "123456"

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce_user -d ecommerce_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s


  postgres-init:
    build:
      context: ./docker/postgres
    container_name: ecommerce-postgres-init
    restart: "no"

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      PGPASSWORD: "123456"

    volumes:
      - ./docker/postgres/init:/init:ro

    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        psql \
          --host postgres \
          --username ecommerce_user \
          --dbname postgres \
          --set ON_ERROR_STOP=1 \
          --file /init/02_metabase_db.sql


  kafka:
    image: apache/kafka:4.0.0
    container_name: ecommerce-kafka
    restart: unless-stopped

    ports:
      - "9092:9094"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3


  kafka-init:
    build:
      context: ./docker/kafka
    container_name: ecommerce-kafka-init
    restart: "no"

    depends_on:
      kafka:
        condition: service_started

    entrypoint: ["/bin/bash", "/opt/kafka/init/01_topics.sh"]


  clickhouse:
    image: clickhouse/clickhouse-server:26.9
    container_name: ecommerce-clickhouse
    restart: unless-stopped

    ports:
      - "8123:8123"
      - "9000:9000"

    environment:
      CLICKHOUSE_DB: ecommerce
      CLICKHOUSE_USER: ecommerce_user
      CLICKHOUSE_PASSWORD: "123456"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1

    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./docker/clickhouse/config.d/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro

    healthcheck:
      test:
        [
          "CMD",
          "clickhouse-client",
          "--user",
          "ecommerce_user",
          "--password",
          "123456",
          "--query",
          "SELECT 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  clickhouse-init:
    image: clickhouse/clickhouse-server:26.9
    container_name: ecommerce-clickhouse-init
    restart: "no"

    depends_on:
      clickhouse:
        condition: service_healthy

    volumes:
      - ./docker/clickhouse/init:/init:ro

    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        clickhouse-client \
          --host clickhouse \
          --user ecommerce_user \
          --password 123456 \
          --database ecommerce \
          --multiquery < /init/01_schema.sql


  metabase:
    image: metabase/metabase:latest
    container_name: ecommerce-metabase
    hostname: metabase
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase_db
      MB_DB_PORT: 5432
      MB_DB_USER: ecommerce_user
      MB_DB_PASS: "123456"
      MB_DB_HOST: postgres
      JAVA_TIMEZONE: Asia/Tehran

    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully

    volumes:
      - /dev/urandom:/dev/random:ro

    healthcheck:
      test: ["CMD", "curl", "--fail", "-I", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s


  # PostgreSQL metrics
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: ecommerce-postgres-exporter
    restart: unless-stopped

    environment:
      DATA_SOURCE_URI: "postgres:5432/ecommerce_db?sslmode=disable"
      DATA_SOURCE_USER: ecommerce_user
      DATA_SOURCE_PASS: "123456"

    depends_on:
      postgres:
        condition: service_healthy


  # Kafka metrics
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: ecommerce-kafka-exporter
    restart: unless-stopped

    command:
      - "--kafka.server=kafka:9092"

    depends_on:
      kafka:
        condition: service_started


  # Docker container metrics
  cadvisor:
    image: ghcr.io/google/cadvisor:latest
    container_name: ecommerce-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro


  # Prometheus metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: ecommerce-prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    depends_on:
      - postgres-exporter
      - kafka-exporter
      - cadvisor
      - clickhouse


  # Grafana dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: ecommerce-grafana
    restart: unless-stopped

    ports:
      - "3001:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "123456"
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus


volumes:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
  prometheus_data:
  grafana_data: